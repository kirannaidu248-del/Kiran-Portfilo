<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page not found · Kiran R</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141c;
    --border: #25252f;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent: #a855f7;
    --accent-2: #3b82f6;
    --accent-3: #22d3ee;
    --gradient: linear-gradient(135deg, #a855f7, #3b82f6 60%, #22d3ee);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.2), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.15), transparent 40%);
    pointer-events: none;
  }
  .wrap {
    text-align: center;
    max-width: 540px;
    position: relative;
    z-index: 1;
  }
  .code {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-size: clamp(120px, 22vw, 200px);
    line-height: 1;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.04em;
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }
  h1 .serif {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: #c084fc;
  }
  p {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gradient);
    color: white;
    padding: 14px 28px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.25s, box-shadow 0.25s;
    box-shadow: 0 4px 24px rgba(168, 85, 247, 0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(168, 85, 247, 0.5);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page took a <span class="serif">detour</span>.</h1>
    <p>The page you're looking for doesn't exist, moved somewhere new, or never made it past the draft folder.</p>
    <a href="/" class="btn">
      Back home
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
</body>
</html>
